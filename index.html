<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16233F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Sûrliv — Livraison</title>
<meta name="description" content="Sûrliv — application de gestion et de livraison." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#16233F; --ink2:#2B3A5C;
    --paper:#F1ECDD; --paperDeep:#E7DFC7;
    --card:#FBF9F2;
    --gold:#C68A2E; --goldDeep:#9C6A1E;
    --green:#1E7A52; --greenSoft:#E3EEE6;
    --rust:#A8432B; --rustSoft:#F4E4DD;
    --slate:#5B5748; --slateLight:#948E76;
    --border:#DED4B4;
  }
  body[data-theme="dark"]{
    --ink:#F1ECDD; --ink2:#D9DCE8;
    --paper:#12161F; --paperDeep:#1D2230;
    --card:#191E29;
    --gold:#E0A94C; --goldDeep:#C68A2E;
    --green:#4CAE83; --greenSoft:#173226;
    --rust:#E07C5F; --rustSoft:#3A2019;
    --slate:#B9B3A0; --slateLight:#726C5C;
    --border:#2C3242;
  }
  body[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,0.86); }
  body[data-theme="dark"] input, body[data-theme="dark"] textarea{ color:var(--ink); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 16px;
  }
  .f-display{font-family:'Fraunces',serif;}
  .f-mono{font-family:'IBM Plex Mono',monospace;}
  ::-webkit-scrollbar{width:0;height:0;}

  /* --- header controls --- */
  .brand{text-align:center; margin-bottom:18px;}
  .brand-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:2px;}
  .brand-badge{width:26px;height:26px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;}
  .brand-title{font-family:'Fraunces',serif; font-size:26px; color:var(--ink);}
  .brand-sub{font-size:12px; color:var(--slateLight);}

  .role-switch{display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--paperDeep); margin-bottom:0;}
  .role-btn{display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:999px; border:none; background:transparent; font-size:12px; font-weight:600; color:var(--slate); cursor:pointer; transition:background .2s ease, color .2s ease;}
  .role-btn.active{background:var(--ink); color:var(--card);}

  .net-toggle{display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); font-size:11px; font-weight:600; color:var(--slate); cursor:pointer; transition:color .2s ease, border-color .2s ease;}
  .net-toggle.off{color:var(--rust); border-color:var(--rust);}

  .top-controls{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; margin-bottom:22px;}
  .stage{display:flex; justify-content:center; width:100%;}
  .footnote{display:block;}

  /* --- phone frame --- */
  .phone{
    width:380px; height:780px; border-radius:44px; border:10px solid var(--ink);
    background:var(--paper); box-shadow:0 30px 60px -20px rgba(22,35,63,.35);
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .sync-banner{display:flex; align-items:center; gap:8px; padding:8px 16px; font-size:11px; font-weight:600; flex-shrink:0; transition:background .3s ease;}
  .phone-body{flex:1; min-height:0; display:flex; flex-direction:column; position:relative;}
  .screen{flex:1; min-height:0; display:flex; flex-direction:column; opacity:1; transform:translateY(0); transition:opacity .22s cubic-bezier(.32,.72,0,1), transform .22s cubic-bezier(.32,.72,0,1);}
  .screen.leaving{opacity:0; transform:translateY(8px);}

  /* --- top bar --- */
  .topbar{display:flex; align-items:center; gap:12px; padding:calc(20px + env(safe-area-inset-top, 0px)) 20px 16px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .topbar-left{display:flex; align-items:center; gap:12px; flex:1;}
  .back-btn{background:none;border:none;cursor:pointer;color:var(--ink);padding:4px;margin-left:-4px;display:flex;transition:transform .15s ease;}
  .back-btn:active{transform:scale(0.85);}
  .icon-badge{width:36px;height:36px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .topbar-title{font-family:'Fraunces',serif; font-size:17px; line-height:1.1; color:var(--ink);}
  .topbar-sub{font-size:11px; color:var(--slateLight); margin-top:2px;}
  .topbar-action{width:36px;height:36px;border-radius:50%;background:var(--ink);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;}
  .topbar-action:active{transform:scale(0.88);}

  /* --- generic --- */
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 20px 24px;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;} .gap12{gap:12px;}
  .muted{color:var(--slateLight);}
  .small{font-size:11px;}
  .btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:14px; font-weight:600; font-size:15px; min-height:48px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; font-family:'IBM Plex Sans',sans-serif;}
  .btn:active{transform:scale(0.97);}
  .btn-ink{background:var(--ink); color:var(--card);}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-rust-outline{background:transparent; border:1px solid var(--rust); color:var(--rust);}
  .btn-dashed{background:transparent; border:1.5px dashed var(--slateLight); color:var(--slateLight);}
  .btn-disabled{background:var(--paperDeep); color:var(--slateLight); cursor:default;}
  .btn-sm{padding:10px; font-size:12.5px; border-radius:11px; min-height:40px;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;}
  .pill{display:inline-flex; align-items:center; gap:4px; padding:5px 9px; border-radius:999px; font-size:11px; font-weight:600;}
  .stat{flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px;}
  .stat-val{font-family:'Fraunces',serif; font-size:20px;}
  .stat-label{font-size:11px; color:var(--slateLight);}

  .order-card{width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; transition:transform .12s ease, border-color .15s ease;}
  .order-card:active{transform:scale(0.98);}
  .order-id{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--goldDeep);}
  .order-client{font-family:'Fraunces',serif; font-size:15px; margin-top:2px;}
  .order-meta{font-size:11px; color:var(--slateLight); margin-top:4px; display:flex; align-items:center; gap:4px;}
  .order-amount{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px;}

  input, textarea, select{width:100%; border-radius:12px; padding:12px; font-size:16px; outline:none; border:1px solid var(--border); background:var(--card); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; -webkit-appearance:none; appearance:none;}
  textarea{resize:none;}
  label.field-label{display:block; font-size:12px; font-weight:600; color:var(--slate); margin-bottom:6px; margin-top:14px;}
  label.field-label:first-child{margin-top:0;}

  /* --- bottom nav --- */
  .bottom-nav{
    display:flex; align-items:center; justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--border); flex-shrink:0;
    background:rgba(251,249,242,0.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:6px 12px; min-width:44px; color:var(--slateLight); transition:color .15s ease, transform .12s ease;}
  .nav-item:active{transform:scale(0.9);}
  .nav-item.active{color:var(--ink);}
  .nav-item span{font-size:10px; font-weight:600;}

  /* --- toggle switch (availability) --- */
  .avail-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; border-radius:16px; padding:12px 16px; border:none; cursor:pointer; margin-bottom:12px; transition:background .2s ease;}

  /* --- overlays --- */
  .overlay{position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .stamp-circle{width:180px;height:180px;border-radius:50%;border:3px solid var(--gold); color:var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transform:scale(0.6) rotate(-16deg); transition:transform .45s cubic-bezier(.2,.8,.25,1.3);}
  .overlay.show .stamp-circle{transform:scale(1) rotate(-7deg);}
  .sos-circle{width:160px;height:160px;border-radius:50%;border:3px solid #FBF9F2; color:#FBF9F2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transform:scale(0.6) rotate(-16deg); transition:transform .45s cubic-bezier(.2,.8,.25,1.3);}
  .overlay.show .sos-circle{transform:scale(1) rotate(-7deg);}
  .overlay-close{margin-top:24px; font-size:11px; font-weight:600; padding:8px 20px; border-radius:999px; background:transparent; cursor:pointer;}
  .sos-recipient{display:flex; align-items:center; justify-content:space-between; border-radius:12px; padding:8px 12px; background:rgba(251,249,242,0.12); color:#FBF9F2; font-size:12px; margin-bottom:8px; opacity:0; transform:translateY(6px); transition:opacity .3s ease, transform .3s ease;}
  .overlay.show .sos-recipient{opacity:1; transform:translateY(0);}

  /* --- signature pad --- */
  .sig-canvas{width:100%; height:110px; border-radius:16px; border:1.5px dashed var(--slateLight); background:var(--card); touch-action:none; display:block; margin-bottom:8px;}

  /* --- chat --- */
  .chat-scroll{flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px;}
  .bubble{max-width:75%; padding:8px 12px; border-radius:16px; font-size:14px;}
  .bubble.me{align-self:flex-end; background:var(--ink); color:var(--card);}
  .bubble.them{align-self:flex-start; background:var(--card); color:var(--ink); border:1px solid var(--border);}
  .bubble-time{font-size:10px; opacity:.6; margin-top:4px;}
  .voice-msg{display:flex; align-items:center; gap:8px;}
  .waveform{display:flex; align-items:flex-end; gap:2px; height:14px;}
  .waveform div{width:2px; background:currentColor; opacity:.6; border-radius:1px;}
  .chat-input-row{display:flex; align-items:center; gap:8px; padding:12px 20px; border-top:1px solid var(--border); flex-shrink:0;}
  .chat-input-row input{flex:1; border-radius:999px;}
  .round-btn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0; transition:transform .12s ease, background .2s ease;}
  .round-btn:active{transform:scale(0.88);}

  /* --- call screen --- */
  .call-screen{flex:1; background:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:48px 32px;}
  .call-avatar{width:80px;height:80px;border-radius:50%;background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:26px;}
  .call-controls{display:flex; align-items:center; gap:24px;}
  .call-btn{width:56px;height:56px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease;}
  .call-btn:active{transform:scale(0.9);}
  .call-btn.end{width:64px;height:64px;background:var(--rust);}

  .zone-bar{height:8px;border-radius:999px;background:var(--paperDeep); overflow:hidden;}
  .zone-bar-fill{height:100%;border-radius:999px;background:var(--gold); transition:width .4s ease;}

  .stars{display:flex; gap:2px;}
  .star-btn{background:none;border:none;cursor:pointer;padding:2px;display:flex;}

  .fade-note{opacity:0; animation:fadeUp .3s ease forwards;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* --- native full-screen mode on real phones (iOS / Android) --- */
  @media (max-width: 480px){
    html, body{height:100%; overscroll-behavior:none;}
    body{
      padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));
      height:100dvh; overflow:hidden;
    }
    .brand{margin-bottom:8px;}
    .brand-badge{width:22px;height:22px;}
    .brand-title{font-size:19px;}
    .footnote-top{display:none;}
    .footnote{display:none;}
    .top-controls{margin-bottom:10px; gap:6px;}
    .role-btn{padding:7px 12px; font-size:11px;}
    .net-toggle{padding:7px 11px; font-size:10px;}
    .stage{flex:1; min-height:0;}
    .phone{
      width:100%; height:100%; max-width:480px; margin:0 auto;
      border:none; border-radius:26px; box-shadow:0 20px 45px -20px rgba(22,35,63,.3);
    }
  }
  @media (max-width: 480px) and (display-mode: standalone){
    .phone{border-radius:0; box-shadow:none;}
  }
  @keyframes spin{from{transform:rotate(0);} to{transform:rotate(360deg);}}
  .spin{animation:spin 1.8s linear infinite;}
</style>

  .topbar-title{font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.025em;}

  .btn-gold{box-shadow:0 7px 16px rgba(242,181,68,.24);}
  input,textarea,select{border-radius:13px;background:#fff;border-color:#D9E1EA;font-size:15px;min-height:48px;}
  input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,181,68,.16);}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748B;margin-top:16px;}
  .bottom-nav{padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);border-top:1px solid rgba(226,232,240,.9);}
  .nav-item{position:relative;padding:7px 13px;color:#94A3B8;}
  .nav-item.active{color:var(--ink);}
  .nav-item.active:before{content:"";position:absolute;top:-8px;width:22px;height:3px;border-radius:999px;background:var(--gold);}
  .nav-item span{font-size:9.5px;margin-top:1px;}
  .avail-toggle{border:1px solid var(--border);box-shadow:0 3px 10px rgba(20,33,61,.04);}
  .section-kicker{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#94A3B8;margin:18px 0 8px;}
  .welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:5px 0 16px;}
  .welcome h1{margin:0;font-size:23px;line-height:1.05;letter-spacing:-.04em;font-weight:800;}
  .welcome p{margin:5px 0 0;font-size:12px;color:var(--slate);}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
  .quick-action{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:1px solid var(--border);background:#fff;border-radius:15px;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink);box-shadow:0 3px 10px rgba(20,33,61,.035);}
  .quick-action .qa-icon{width:32px;height:32px;border-radius:10px;background:var(--paperDeep);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .hero-card{border:0!important;border-radius:20px!important;box-shadow:var(--shadow)!important;}
  .empty-state{text-align:center;padding:34px 18px;border:1px dashed #CBD5E1;border-radius:18px;background:rgba(255,255,255,.65);}
  .fab{width:52px!important;height:52px!important;border-radius:17px!important;}
  @media(max-width:600px){
    body{padding:0;display:block;background:var(--paper);}
    .brand,.top-controls{display:none;}
    .stage,.phone{width:100%;}
    .phone{height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none;}
    .topbar{padding-top:calc(14px + env(safe-area-inset-top,0px));}
  }
</style>

<body>

<div class="brand">
  <div class="brand-row">
    <div class="brand-badge">🛡️</div>
    <div class="brand-title">Sûrliv</div>
  </div>
  <div class="brand-sub footnote-top">La preuve à chaque livraison — maquette interactive</div>
</div>

<div id="topControls" class="top-controls">
  <div class="role-switch">
    <button class="role-btn active" id="roleMarchandBtn" onclick="setRole('marchand')">📦 Marchand</button>
    <button class="role-btn" id="roleLivreurBtn" onclick="setRole('livreur')">🛵 Livreur</button>

<div class="stage">

  <div id="syncBanner" class="sync-banner" style="display:none;"></div>

  <div class="overlay" id="stampOverlay"></div>
  <div class="overlay" id="sosOverlay"></div>
</div>
</div>

/* ================= LOCAL PERSISTENCE (V1) =================
   Cette version conserve les commandes, l'état du livreur et la session
   sur l'appareil. Le même contrat pourra ensuite être branché à une API. */
const STORAGE_KEY = "surliv:v1";
function loadLocalData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.orders) DATA.orders = saved.orders;
    if(saved.livreurs) DATA.livreurs = saved.livreurs;
    if(saved.filleuls) DATA.filleuls = saved.filleuls;
  } catch(e) {}
}
function saveLocalData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      orders: DATA.orders, livreurs: DATA.livreurs, filleuls: DATA.filleuls
    }));
    localStorage.setItem(STORAGE_KEY+":state", JSON.stringify({
      role:S.role, theme:S.theme, l:S.l, m:S.m, a:S.a, auth:S.auth
    }));
  } catch(e) {}
}
function loadLocalState(){
  try {
    const raw=localStorage.getItem(STORAGE_KEY+":state");
    if(!raw) return;
    const saved=JSON.parse(raw);
    if(saved.role) S.role=saved.role;
    if(saved.theme) S.theme=saved.theme;
    if(saved.l) Object.assign(S.l,saved.l);
    if(saved.m) Object.assign(S.m,saved.m);
    if(saved.a) Object.assign(S.a,saved.a);
    if(saved.auth) Object.assign(S.auth,saved.auth);
  } catch(e) {}
}
loadLocalData();
loadLocalState();

  }

}

/* ================= DEVICE LOCATION ================= */
function captureLocation(callback){
  if(!navigator.geolocation){ callback(null); return; }
  navigator.geolocation.getCurrentPosition(
    pos => callback({lat:Number(pos.coords.latitude.toFixed(6)), lng:Number(pos.coords.longitude.toFixed(6)), accuracy:Math.round(pos.coords.accuracy||0), at:new Date().toISOString()}),
    () => callback(null),
    {enableHighAccuracy:true, timeout:8000, maximumAge:30000}
  );
}

/* ================= DYNAMIC BEHAVIOR (canvas, timers) ================= */
let sigCtx=null, sigDrawing=false, sigHasDrawn=false;
let callTimerInterval=null, callSeconds=0, muted=false, speakerOn=false;

function attachDynamic(){
  const canvas = document.getElementById("sigPad");
  if(canvas){
    sigCtx = canvas.getContext("2d");
    sigHasDrawn = false;
    const pos = (e)=>{ const r=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; };
    const start=(e)=>{ sigDrawing=true; const {x,y}=pos(e); sigCtx.beginPath(); sigCtx.moveTo(x,y); };
    const move=(e)=>{ if(!sigDrawing) return; const {x,y}=pos(e); sigCtx.lineTo(x,y); sigCtx.strokeStyle="#16233F"; sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.stroke(); sigHasDrawn=true; };
    const end=()=>{ sigDrawing=false; };
    canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move);
    canvas.addEventListener("mouseup",end); canvas.addEventListener("mouseleave",end);
    canvas.addEventListener("touchstart",start); canvas.addEventListener("touchmove",move); canvas.addEventListener("touchend",end);
  }
  const chatScroll = document.getElementById("chatScroll");
  if(chatScroll) chatScroll.scrollTop = chatScroll.scrollHeight;

  const callTimer = document.getElementById("callTimer");
  if(callTimer){
    callSeconds=0; clearInterval(callTimerInterval);
    callTimerInterval = setInterval(()=>{
      callSeconds++;
      const mm=String(Math.floor(callSeconds/60)).padStart(2,"0"), ss=String(callSeconds%60).padStart(2,"0");
      const t=document.getElementById("callTimer"); if(t) t.textContent=`${mm}:${ss}`; else clearInterval(callTimerInterval);
    },1000);
  } else { clearInterval(callTimerInterval); }
}

  const a = el.dataset.action, id = el.dataset.id;
  switch(a){
    case "authChooseRole": S.auth.role = el.dataset.role; S.auth.step="form"; renderTransition(); break;
    case "authBackChoose": S.auth.step="choose"; renderTransition(); break;
    case "authSubmitForm": {
      S.auth.form = {
        name: (document.getElementById("authName")||{}).value || "",
        business: (document.getElementById("authBusiness")||{}).value || "",
        phone: (document.getElementById("authPhone")||{}).value || "",
        zone: (document.getElementById("authZone")||{}).value || "",
        address: (document.getElementById("authAddress")||{}).value || "",
        ref: (document.getElementById("authRef")||{}).value || "",
      };
      S.auth.step="verif";
      renderTransition();
      break;
    }
    case "authBackForm": S.auth.step="form"; renderTransition(); break;
    case "authCapture": S.auth.verifDone[el.dataset.doc]=true; renderTransition(); break;
    case "authSubmitVerif": S.auth.step="pending"; renderTransition(); break;
    case "authSimulateVerified": S.auth.step="verified"; renderTransition(); break;
    case "authGoToPaiement": S.auth.step="paiement"; S.temp={}; renderTransition(); break;
    case "authBackToVerified": S.auth.step="verified"; S.temp={}; renderTransition(); break;
    case "authPaymentDone": {
      S.mode="app";
      S.role = S.auth.role;
      if(S.role==="livreur") S.l.rechargeOn = true;
      document.getElementById("roleMarchandBtn").classList.toggle("active", S.role==="marchand");
      document.getElementById("roleLivreurBtn").classList.toggle("active", S.role==="livreur");
      document.getElementById("roleAdminBtn").classList.toggle("active", S.role==="admin");
      go(S.role, "accueil");
      break;
    }
    case "authEnterApp": {
      S.mode="app";
      S.role = S.auth.role;
      document.getElementById("roleMarchandBtn").classList.toggle("active", S.role==="marchand");
      document.getElementById("roleLivreurBtn").classList.toggle("active", S.role==="livreur");
      document.getElementById("roleAdminBtn").classList.toggle("active", S.role==="admin");
      go(S.role, "accueil");
      break;
    }
    case "navM": go("marchand", el.dataset.screen); break;
    case "navL": go("livreur", el.dataset.screen); break;
    case "navA": S.a.screen=el.dataset.screen; renderTransition(); break;
    case "navABack": S.a.screen="accueil"; renderTransition(); break;
    case "navMDetail": go("marchand","detail", id); break;
    case "navMBack": go("marchand","accueil"); break;
    case "navMBack2": go("marchand","detail", S.m.orderId); break;
    case "navMChat": go("marchand","chat", S.m.orderId); break;
    case "navMChatCall": go("marchand","call", S.m.orderId); break;
    case "navMEndCall": go("marchand","chat", S.m.orderId); break;
    case "navMStatsBack": go("marchand","profil"); break;
    case "submitOrder": {
      const inputs=[...document.querySelectorAll("#screen input")];
      const client=(inputs[0]?.value||"Client Sûrliv").trim();
      const phone=(inputs[1]?.value||"").trim();
      const amountRaw=(document.getElementById("montantInput")?.value||"").replace(/[^0-9]/g,"");
      const amount=Number(amountRaw||S.temp.tarif||5000);
      const id=`SGL-${new Date().getFullYear()}-${String(DATA.orders.length+346).padStart(4,"0")}`;
      DATA.orders.unshift({id,client,phone,zone:"Abidjan",amount,mode:"cash",status:"attente",livreur:"Koffi Yao",time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),eta:"--"});
      queueIfOffline(); S.temp.sent=true; saveLocalData(); renderTransition(); break;
    }
    case "copyLink": S.temp.copied=true; renderTransition(); setTimeout(()=>{S.temp.copied=false;},1800); break;

    case "navLMission": go("livreur","mission", id); break;
    case "navLBackHome": go("livreur","accueil"); break;
    case "navLBackToMission": go("livreur","mission", S.l.orderId); break;
    case "navLChat": go("livreur","chat", S.l.orderId); break;
    case "navLChatCall": go("livreur","call", S.l.orderId); break;
    case "navLEndCall": go("livreur","chat", S.l.orderId); break;
    case "navLProblem": go("livreur","probleme", S.l.orderId); break;
    case "toggleAvailable": S.l.available=!S.l.available; renderTransition(); break;
    case "activateDay": S.l.rechargeOn=true; renderTransition(); break;
    case "pickPayMethod": S.temp.payMethodKey = el.dataset.method; S.temp.payMethod = el.dataset.label; renderTransition(); break;
    case "setRechargeMethod": S.l.rechargeMethod = el.dataset.method; renderTransition(); break;
    case "startPayment": {
      S.temp.payPhase = "processing";
      renderTransition();
      setTimeout(()=>{ S.temp.payPhase = "success"; renderTransition(); }, 1800);
      break;
    }
    case "paySuccessMarchand": S.temp = {}; go("marchand","profil"); break;
    case "paySuccessLivreur": S.l.rechargeOn = true; S.temp = {}; go("livreur","accueil"); break;
    case "takePhoto": S.temp.photoTaken=true; renderTransition(); break;
    case "clearCanvas": if(sigCtx){ sigCtx.clearRect(0,0,310,110); sigHasDrawn=false; } break;
    case "validateSignature":
      if(sigHasDrawn && document.getElementById("sigPad")){
        S.temp.signature = document.getElementById("sigPad").toDataURL();
        renderTransition();
      }
      break;
    case "clearSignature": S.temp.signature=null; renderTransition(); break;
    case "copyLinkMission": S.temp.copied=true; renderTransition(); setTimeout(()=>{S.temp.copied=false;},1800); break;
    case "confirmDelivery": {
      const o = getOrder(S.l.orderId);
      o.status="livre";
      o.proof = { time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}), geo:`${o.zone} · position en cours…`, signature:S.temp.signature || null };
      queueIfOffline();
      captureLocation(loc => {
        if(loc){ o.proof.location=loc; o.proof.geo=`GPS ${loc.lat}, ${loc.lng} · précision ${loc.accuracy} m`; }
        saveLocalData();
        showStamp(o);
      });
      break;
    }
    case "closeStamp": closeStamp(); break;
    case "openSos": showSos(); break;
    case "closeSos": closeSos(); break;
    case "pickReason": S.temp.reason = el.dataset.reason; renderTransition(); break;
    case "submitProblemL": {
      const note = (document.getElementById("problemNote")||{}).value || "";
      const o = getOrder(S.l.orderId);
      o.status="probleme"; o.problem={ reason:S.temp.reason, note };
      queueIfOffline();
      go("livreur","accueil");
      break;
    }
    case "toggleRecordOrSend": {
      const draft = (S.temp.draft||"").trim();
      if(draft){
        S.temp.messages = (S.temp.messages||[]).concat([{from:"me", text:draft, time:"à l'instant"}]);
        S.temp.draft = "";
        renderTransition();
      } else {
        if(S.temp.recording){
          const dur = `0:${String(2+Math.floor(Math.random()*8)).padStart(2,"0")}`;
          S.temp.messages = (S.temp.messages||[]).concat([{from:"me", voice:true, duration:dur, time:"à l'instant"}]);
          S.temp.recording=false;
        } else { S.temp.recording=true; }
        renderTransition();
      }
      break;
    }
    case "toggleMute": muted=!muted; document.getElementById("muteBtn").style.background = muted?"var(--gold)":"rgba(255,255,255,.12)"; break;
    case "toggleSpeaker": speakerOn=!speakerOn; document.getElementById("speakerBtn").style.background = speakerOn?"var(--gold)":"rgba(255,255,255,.12)"; break;
    case "rate": S.l.ratings[el.dataset.name] = parseInt(el.dataset.val,10); renderTransition(); break;
    case "toggleTheme": {
      S.theme = S.theme==="dark" ? "light" : "dark";
      document.body.dataset.theme = S.theme;
      renderTransition();
      break;
    }
    case "importBulk": S.temp.imported=true; renderTransition(); setTimeout(()=>{S.temp.imported=false;},1800); break;
    case "calcTarif": S.temp.tarif = 2000 + Math.floor(Math.random()*4)*1500; renderTransition(); break;
    case "exportStats": S.temp.exported=true; renderTransition(); setTimeout(()=>{S.temp.exported=false;},1800); break;
    case "scanQr": S.temp.qrScanned=true; renderTransition(); break;
    case "toggleFaq": S.temp.openFaq = (S.temp.openFaq===parseInt(el.dataset.idx,10)) ? null : parseInt(el.dataset.idx,10); renderTransition(); break;
  }
});

/* ================= API V3 BRIDGE =================
   Le mode local reste disponible hors connexion. Quand l'app est servie par
   server.js, les commandes sont synchronisées avec SQLite et les événements
   sont poussés aux autres appareils via Server-Sent Events (SSE).
*/
const API_BASE = (location.protocol === "http:" || location.protocol === "https:") ? "" : "";
let apiBusy = false;
let apiReady = false;
let apiLastServer = "";
async function apiJson(url, options={}){
  const r = await fetch(API_BASE+url, {headers:{"Content-Type":"application/json",...(options.headers||{})}, ...options});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function applyServerSnapshot(snap, redraw=true){
  if(!snap) return;
  if(Array.isArray(snap.orders)) DATA.orders = snap.orders;
  if(Array.isArray(snap.livreurs)) DATA.livreurs = snap.livreurs;
  apiLastServer = snap.serverTime || new Date().toISOString();
  apiReady = true;
  try{ localSaveOriginal(); }catch(e){}
  if(redraw) render();
}
async function apiBootstrap(){
  try{ const snap=await apiJson('/api/bootstrap'); applyServerSnapshot(snap,false); }
  catch(e){ apiReady=false; }
}
async function apiPush(){
  if(!apiReady || apiBusy || !navigator.onLine) return;
  apiBusy=true;
  try{ const snap=await apiJson('/api/sync',{method:'POST',body:JSON.stringify({orders:DATA.orders})}); applyServerSnapshot(snap,false); }
  catch(e){}
  finally{ apiBusy=false; }
}
function startRealtime(){
  if(!apiReady || !window.EventSource) return;
  try{
    const es=new EventSource(API_BASE+'/api/events');
    es.addEventListener('snapshot.updated',e=>{ try{applyServerSnapshot(JSON.parse(e.data));}catch(_){} });
    es.addEventListener('order.updated',e=>{ try{ const o=JSON.parse(e.data); const i=DATA.orders.findIndex(x=>x.id===o.id); if(i>=0) DATA.orders[i]=o; else DATA.orders.unshift(o); localSaveOriginal(); render(); }catch(_){} });
    es.addEventListener('livreur.updated',e=>{ try{ const l=JSON.parse(e.data); const i=DATA.livreurs.findIndex(x=>x.id===l.id); if(i>=0) DATA.livreurs[i]={...l,available:!!l.available}; render(); }catch(_){} });
    es.onerror=()=>{};
  }catch(e){}
}
const localSaveOriginal = saveLocalData;
saveLocalData = function(){
  localSaveOriginal();
  clearTimeout(window.__surlivPushTimer);
  window.__surlivPushTimer=setTimeout(apiPush,350);
};
window.addEventListener('online',()=>{ apiBootstrap().then(()=>{apiPush();startRealtime();}); });
apiBootstrap().then(()=>startRealtime());

/* ================= INIT ================= */
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
