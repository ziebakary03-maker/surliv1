# fly.toml app configuration file generated for tzb-app on 2026-08-28T22:30:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tzb-app'
primary_region = 'cdg'

[build]

[env]
  DETECTOR_BACKEND = 'opencv'
  DEVICE = 'cpu'
  ENV = 'production'
  MAX_CONCURRENT_JOBS = '2'
  MAX_OCCLUSION_FRAMES = '45'
  MAX_VIDEO_DURATION_SECONDS = '120'
  MAX_VIDEO_SIZE_MB = '200'
  STORAGE_BACKEND = 's3'

[processes]
  web = 'uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000'
  worker = 'python worker/worker.py'

[deploy]
  strategy = 'rolling'
  max_unavailable = 0.5

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['web']

[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['worker']
