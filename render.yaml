services:
  - type: web
    name: surliv-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surliv-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: surliv-db
    plan: free
